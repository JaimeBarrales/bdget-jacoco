name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # 1. Análisis de seguridad con Snyk (SCA)
  # =========================
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Clona el repositorio

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master  # Instala la CLI oficial de Snyk

      - name: Authenticate Snyk CLI
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}  # Token guardado en GitHub Secrets
        run: snyk auth $SNYK_TOKEN

      - name: Snyk test Java dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=pom.xml --severity-threshold=high  # Falla si hay vulnerabilidades altas o críticas

      - name: Generate Snyk JSON Report
        if: always()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "Generando reporte JSON de Snyk..."
          snyk test --file=pom.xml --json > snyk-report.json || echo "Falló snyk test, pero se continúa"
          ls -lh snyk-report.json || echo "No se generó el reporte"

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json

  # =========================
  # 2. Pruebas unitarias y cobertura con JaCoCo
  # =========================
  test:
    name: Run Tests with JaCoCo
    runs-on: ubuntu-latest
    needs: snyk-scan  # Solo se ejecuta si pasó el escaneo de Snyk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify  # Ejecuta los tests y genera el reporte de cobertura JaCoCo

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # =========================
  # 3. Análisis de calidad con SonarCloud (SAST)
  # =========================
  sonar-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test  # Solo se ejecuta si pasaron los tests

    env:
      # 👇 CAMBIA ESTOS DOS VALORES por los de TU proyecto en SonarCloud
      SONAR_ORGANIZATION: JaimeBarrales
      SONAR_PROJECT_KEY: JaimeBarrales_bdget-jacoco

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historial completo para SonarCloud

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # Token SonarCloud desde Secrets
        run: |
          mvn -B verify sonar:sonar \
            -Dsonar.projectKey=$SONAR_PROJECT_KEY \
            -Dsonar.organization=$SONAR_ORGANIZATION \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  # =========================
  # 4. Empaquetado final de la aplicación
  # =========================
  build:
    name: Build Jar
    runs-on: ubuntu-latest
    needs: sonar-analysis  # Solo se ejecuta si pasa el análisis de calidad

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Package application
        run: mvn -B clean package -DskipTests  # Empaqueta sin volver a ejecutar pruebas

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar  # Sube el .jar como artefacto del pipeline
